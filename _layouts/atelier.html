<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.resumo | default: site.description | strip_html | escape }}">
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
</head>
<body>
<nav class="site-nav" aria-label="Menu principal">
  <div class="sn-in">
    <ul class="sn-menu">
      <li><a href="{{ '/index.html' | relative_url }}">05AT</a></li>
      <li><a href="{{ '/index.html#arquitectura' | relative_url }}">Arquitectura</a></li>
      <li><a href="{{ '/index.html#design' | relative_url }}">Store Design</a></li>
      <li><a href="{{ '/index.html#portfolio' | relative_url }}">Portfolio</a></li>
      <li><a href="{{ '/blog.html' | relative_url }}"{% if page.url contains 'blog' %} aria-current="page"{% endif %}>Blog</a></li>
      <li>
        <button type="button" class="sn-btn sn-caret" aria-haspopup="true" aria-expanded="false">Ferramentas para o ajudar</button>
        <ul class="sn-sub">
          <li><a href="{{ '/Questionario.html' | relative_url }}">Quiz - Qual o teu estilo</a></li>
          <li><a href="{{ '/analiseplanta.html' | relative_url }}">Questionário para análise inicial da sua planta</a></li>
        </ul>
      </li>
    </ul>
  </div>
</nav>

  <main>
    {{ content }}
  </main>

  <footer class="rodape">
    <span>{{ site.title }}</span>
    <a href="{{ '/index.html' | relative_url }}">Voltar ao site</a>
  </footer>

<script>
  // Menu do site: abre/fecha ao toque e fecha ao clicar fora
  (function () {
    var items = document.querySelectorAll('.site-nav .sn-menu > li');
    items.forEach(function (li) {
      var btn = li.querySelector(':scope > button');
      if (!btn) return;
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = li.classList.toggle('open');
        btn.setAttribute('aria-expanded', open);
      });
    });
    document.addEventListener('click', function () {
      items.forEach(function (li) {
        var b = li.querySelector(':scope > button');
        if (b) { li.classList.remove('open'); b.setAttribute('aria-expanded', 'false'); }
      });
    });
  })();
</script>
</body>
</html>
