<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.resumo | default: site.description | strip_html | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <!-- Se quiser, substitua esta navegação pelo menu completo do site -->
    <nav aria-label="Principal">
      <a href="{{ '/' | relative_url }}">Início</a>
      <a href="{{ '/blog.html' | relative_url }}"{% if page.url contains 'blog' %} aria-current="page"{% endif %}>Blog</a>
      <a href="https://www.instagram.com/{{ site.instagram_user }}/" target="_blank" rel="noopener">Instagram</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="rodape">
    <span>{{ site.title }}</span>
    <a href="{{ '/' | relative_url }}">Voltar ao site</a>
  </footer>
</body>
</html>
