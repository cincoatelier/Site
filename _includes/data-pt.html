{%- assign meses = "janeiro,fevereiro,março,abril,maio,junho,julho,agosto,setembro,outubro,novembro,dezembro" | split: "," -%}
{%- assign idx = include.data | date: "%-m" | minus: 1 -%}
<time datetime="{{ include.data | date_to_xmlschema }}">{{ include.data | date: "%-d" }} de {{ meses[idx] }} de {{ include.data | date: "%Y" }}</time>
